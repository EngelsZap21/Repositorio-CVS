<!DOCTYPE html>
<html>
<head>
    <title>Hola Mundo JS</title>
</head>
<body>
    <button onclick="saludar()">Haz clic aquí</button>
    <p id="mensaje"></p>

    <script>
        function saludar() {
            document.getElementById("mensaje").innerHTML = "¡Hola Mundo con JavaScript!";
        }
    </script>
</body>
</html>
